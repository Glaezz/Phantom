<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Uji Phantom</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 48px auto;
        padding: 0 16px;
        background: #f7f7f5;
      }
      form {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #e2e2de;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      label { font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
      input {
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #cfcfcb;
        border-radius: 8px;
        min-height: 44px;
      }
      button {
        min-height: 48px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #202020;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Halaman Uji Phantom</h1>
    <p>Form statis untuk mencoba FieldCallout (fokus kolom sandi) dan soft gate (kirim form) secara manual.</p>
    <form id="login" action="https://example.net/collect" method="post">
      <label>
        Nama pengguna
        <input type="text" name="username" autocomplete="username" />
      </label>
      <label>
        Kata sandi
        <input type="password" name="password" autocomplete="current-password" />
      </label>
      <label>
        Kode OTP
        <input type="text" name="otp" autocomplete="one-time-code" inputmode="numeric" />
      </label>
      <button type="submit">Masuk</button>
    </form>
  </body>
</html>
